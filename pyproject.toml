[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ix-zerocell"
version = "0.2.0"
description = "Battery-free DC power: ZC-D10 reference assembly and twenty-channel 1 kW engineering design"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Bryce Lovell"}]
dependencies = []

[project.scripts]
ix-zerocell = "ix_zerocell.__main__:main"

[tool.setuptools]
packages = ["ix_zerocell"]
